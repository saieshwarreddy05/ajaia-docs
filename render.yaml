services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/ajaia-docs.db
      - key: SESSION_SECRET
        generateValue: true
